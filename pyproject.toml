[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowremote"
version = "0.1.0"
description = "FlowRemote AI-RPA - mobile supervision and approval for AI-assisted data processing"
readme = "README.md"
requires-python = ">=3.13"

# The first slice has no third-party dependencies on purpose: it runs on a
# clean Python install with no network access. Later slices add the extras
# below.
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=44.0.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.0.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.4"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
