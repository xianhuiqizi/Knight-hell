<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FlowRemote{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=20261019">
  <script src="/static/app.js?v=20261019" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="mark">FR</span>
      <span class="brand-text">FlowRemote<small>Live RPA</small></span>
    </a>
    {% if user %}
    <div class="who">
      <span class="badge badge-{{ user.role }}">{{ user.role }}</span>
      <span class="who-name">{{ user.name }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="btn-ghost">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
