{% extends "base.html" %}
{% block title %}Create account - FlowRemote{% endblock %}
{% block content %}
<section class="auth">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Every person signs in with their own work email.</p>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/signup">
      <label>Name
        <input type="text" name="name" value="{{ values.name|default('') }}" required autofocus>
      </label>
      <label>Work email
        <input type="email" name="email" value="{{ values.email|default('') }}" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="8" required>
      </label>
      <label>Password again
        <input type="password" name="password_again" minlength="8" required>
      </label>
      <button class="btn-primary" type="submit">Create account</button>
    </form>
    <p class="hint">Already registered? <a href="/login">Log in</a></p>
  </div>
</section>
{% endblock %}
